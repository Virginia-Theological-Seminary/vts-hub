[build]
  publish = "site"

# Documents are private by definition — keep them out of search engines
# and out of shared caches even before the edge function runs.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
    # No inline script is used anywhere on the site, so script-src can
    # stay at 'self' with no escape hatch — which is what makes an
    # injected <script> inert even if one ever got through. The two
    # Microsoft hosts are for MSAL: connect-src for the token call,
    # frame-src for the hidden iframe it uses to renew tokens silently.
    # base-uri and object-src are closed off outright.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com; frame-src 'self' https://login.microsoftonline.com; form-action 'self'; frame-ancestors 'self'; base-uri 'none'; object-src 'none'"

[[headers]]
  for = "/files/*"
  [headers.values]
    Cache-Control = "private, no-store"

# The hub and the two auth pages are per-user views behind a session.
# no-store keeps them out of the back/forward cache, so pressing Back
# after Sign out cannot redisplay a signed-in page from memory.
# (protect-app.js sets the same header on the hub at the edge; this
# covers the auth pages, which it does not sit in front of.)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/login.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/signup.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/forgot.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# The reset page arrives with a one-time token in its query string.
# no-store plus the site-wide Referrer-Policy keep that token out of
# caches and out of any Referer header that leaves the site.
[[headers]]
  for = "/reset.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/verify.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# Netlify serves /login.html at /login on its own, but the auth layer
# redirects to these paths by name, so they are declared rather than
# left to a default that could change.
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

[[redirects]]
  from = "/forgot"
  to = "/forgot.html"
  status = 200

[[redirects]]
  from = "/reset"
  to = "/reset.html"
  status = 200

[[redirects]]
  from = "/verify"
  to = "/verify.html"
  status = 200

# Single-page behaviour: the MSAL redirect returns to "/" with a hash,
# which is served by index.html anyway. No rewrite needed for /files/
# or /api/ — the edge functions claim those paths themselves.
