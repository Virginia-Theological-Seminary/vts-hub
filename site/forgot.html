<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Forgot password — VTS Hub</title>
<meta name="theme-color" content="#293891">
<link rel="icon" href="assets/favicon.png" sizes="180x180">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body class="gate">

<div class="gate-card auth-card">
  <img class="gate-logo" src="assets/logo-full.jpg"
       alt="Virginia Theological Seminary" width="1210" height="1029">

  <h1>Forgot your password?</h1>
  <p class="gate-sub">
    Enter your <strong>@vts.edu</strong> address and we'll send you a link
    to choose a new one.
  </p>

  <p class="auth-alert" id="form-alert" role="alert" hidden></p>

  <!-- Shown after a successful request in place of the form. -->
  <div id="sent" hidden>
    <p class="auth-alert is-success" id="sent-message" role="status"></p>
    <p class="field-hint" id="sent-hint" hidden></p>
  </div>

  <form id="forgot-form" novalidate>
    <div class="field" id="field-email">
      <label for="email">VTS email address</label>
      <input id="email" name="email" type="email" inputmode="email"
             autocomplete="username" spellcheck="false"
             placeholder="you@vts.edu" required>
      <p class="field-error" id="error-email" hidden></p>
    </div>

    <button class="btn-primary" id="submit" type="submit">Send reset link</button>
  </form>

  <p class="auth-alt">
    Remembered it? <a href="/login" id="login-link">Back to sign in</a>
  </p>
</div>

<p class="auth-foot">
  Virginia Theological Seminary · Internal use only.
</p>

<script src="assets/auth-client.js"></script>
<script src="assets/auth-pages.js"></script>
</body>
</html>
